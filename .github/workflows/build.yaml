name: Build Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install JPRM
        run: pip install jprm

      - name: Build Plugin
        run: |
          echo "--- 复制配置文件到项目目录 ---"
          cp build.yaml Jellyfin.Plugin.FolderCollections/build.yaml
          
          echo "--- 创建输出文件夹（关键一步！）---"
          mkdir -p ${{ github.workspace }}/artifacts
          
          echo "--- 进入项目目录并执行打包 ---"
          cd Jellyfin.Plugin.FolderCollections
          jprm --verbosity debug plugin build . --dotnet-framework net8.0 --dotnet-configuration Release --version 1.0.0.0 --output ${{ github.workspace }}/artifacts

      - name: Debug - Find zip files
        run: find ${{ github.workspace }}/artifacts -name "*.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.FolderCollections
          path: ${{ github.workspace }}/artifacts/*.zip